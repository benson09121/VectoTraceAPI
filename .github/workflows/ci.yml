name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Django Tests & Type Checking
        run: |
          python manage.py test
        env:
          SECRET_KEY: 'ci-test-key'
          DEBUG: 'True'
          DB_HOST: 'localhost'

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Lint and Type Check
        working-directory: ./frontend
        run: |
          npm run lint
          npx tsc --noEmit
      - name: E2E Tests
        working-directory: ./frontend
        run: npm run test:e2e

  build-and-sbom:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, security-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Build Production Image
        run: docker build -t vectotrace-api:latest -f dockerfile .
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vectotrace-api:latest'
          format: 'spdx-json'
          output: 'sbom.spdx.json'
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image for scanning
        run: docker build -t vectotrace-api:test -f dockerfile .
        
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'vectotrace-api:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
